body{margin:0}img{max-width:100%}
/* Layout: one page. Full-screen hero (hard-cut slideshow, one hook mockup per project, typed bio) → scroll snaps to the
   accordion index (hero folds away; a Home row brings it back). Index = count + filters, then stacked project headers that open into
   [sticky info column | draggable divider | scrolling media]. List or card view. Light/dark set by the site's own toggle. */
:root{
  --bg:#e6e6e9;        /* page + index top: the darkest grey */
  --paper:#eeeef0;     /* closed project headers: lighter */
  --openhead:#f4f4f5;  /* header of an open project: lighter still */
  --column:#f9f9fa;    /* info column of an open project: the lightest */
  --ink:#141416;
  --muted:#74747b;
  --line:#d4d4d9;
  --media:#2b2b2f;     /* behind images */
  --pill:#ffffff;
  --bubble:#ffffff;    /* info chat bubbles + corner buttons: white so they stand off the greys */
  --accent:var(--ink); /* highlight: neutral, no red */
  --font:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --split:416px;
  color-scheme:light;
}
:root.dark{
  --bg:#141416;--paper:#1c1c1f;--openhead:#2f2f34;--column:#242428;--ink:#ececee;--muted:#8a8a92;--line:#313136;--media:#0c0c0e;--pill:#2a2a2f;--bubble:#2a2a2f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav{display:flex;gap:18px;font-size:15px;align-items:center}
.nav button,.nav a{border-bottom:1px solid transparent;text-decoration:none}
.nav button:hover,.nav button[aria-current="true"]{border-color:currentColor}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:420px;background:#111;color:#fff;overflow:hidden}
.hero .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
#slidebox{position:absolute;inset:0;overflow:hidden;background:#111}
/* phone pictures are shown whole; the spare edges are filled with a soft, blurred copy of the same picture */
.hero .slide.fit{object-fit:contain}
.hero .slide.fillbg{filter:blur(28px) saturate(1.1);transform:scale(1.15);pointer-events:none}
.hero iframe.slide{border:0;left:50%;top:50%;inset:auto;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%);pointer-events:none}
.hero .scrim{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72));pointer-events:none}
.hero .top{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 28px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0));pointer-events:none}
.hero .top>*{pointer-events:auto}
.hero .name{font-size:15px;line-height:1.2}
.hero .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 28px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;pointer-events:none}
.type{margin:0;max-width:22em;font-size:clamp(22px,3.2vw,50px);line-height:1.16;font-weight:400;text-wrap:pretty;min-height:3.5em}
.type a{pointer-events:auto;text-underline-offset:.12em;text-decoration-thickness:2px}
.type .caret{display:inline-block;width:.06em;height:.9em;background:#fff;margin-left:.06em;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cap{text-align:right;font-size:14px;line-height:1.3;pointer-events:auto;display:grid;gap:10px;justify-items:end;margin-bottom:58px}
.cap b{font-weight:500;font-size:16px}
.hero .cap{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:3;margin:0;text-align:center;justify-items:center;gap:12px;width:max-content;max-width:calc(100% - 140px)}
.cap .pname{font-size:15px;line-height:1.3;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.cap .pname b{font-weight:600}
.cap .pname:hover b{text-decoration:underline;text-underline-offset:.2em}
.ticks{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.ticks button{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.32);transition:background .2s,transform .2s}
.ticks button:hover{background:#fff}
.ticks button.on{background:#fff;transform:scale(1.35)}
.zone{position:absolute;top:0;bottom:0;width:22%;z-index:2;display:flex;align-items:center;cursor:none;color:#fff}
.zone.l{left:0;justify-content:flex-start;padding-left:2vw}
.zone.r{right:0;justify-content:flex-end;padding-right:2vw}
.zone svg{display:none}
.zone:focus-visible svg{display:block;width:40px;height:auto}
@media (hover:none){.zone{cursor:pointer}.zone svg{display:block;width:30px;height:auto;opacity:.8}}
@media (max-width:820px){.zone{display:none}}
.cur{position:fixed;left:0;top:0;z-index:60;pointer-events:none;color:#fff;opacity:0;transition:opacity .18s}
.cur.on{opacity:1}
.cur svg{display:block;width:clamp(34px,3vw,50px);height:auto;transform:translate(-50%,-50%) scale(var(--s,1));transition:transform .25s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 2px 10px rgba(0,0,0,.3))}
.cur.l svg{transform:translate(-50%,-50%) scale(var(--s,1)) rotate(180deg)}
.cur.tap{--s:.82}
.down{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);pointer-events:auto}

/* ---------- index top ---------- */
#index{scroll-margin-top:0}
.home-row{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:center;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  transform:translateY(-101%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.home-row.show{transform:none}
.home-row button{display:flex;align-items:center;gap:8px;padding:12px 20px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.home-row button:hover{color:var(--ink)}
.home-row b{font-size:16px;font-weight:400;letter-spacing:0}
.ix-top{display:grid;grid-template-columns:var(--split) 1fr auto;gap:16px;align-items:start;padding:20px 28px 18px;border-bottom:1px solid var(--line)}
.ix-top h2{margin:0;font-weight:400;font-size:25px;line-height:1.3}
.ix-top h2 span{color:var(--muted);font-variant-numeric:tabular-nums}
.ix-top .tags{padding-top:6px}
.ix-top .tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ix-top .tag:not(.on){opacity:.55}
.ix-top .tag:hover{opacity:1}
.ctrls{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font-size:13px;padding:3px 9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.theme-ic{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--ink);transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.theme-ic:hover{background:var(--line)}
.theme-ic svg{width:16px;height:16px;display:block}
:root.dark .theme-ic{transform:rotate(180deg)}
.tag.clr{border-style:dashed;opacity:1!important;background:transparent}

/* ---------- corner dock + info chat ---------- */
.dock{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:8px}
.dk{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:color-mix(in srgb,var(--bubble) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.1);transition:color .2s,background .2s,transform .2s}
.dk:hover,.dk[aria-expanded="true"]{color:var(--accent)}
.dk:active{transform:scale(.94)}
.dk svg{width:18px;height:18px;display:block}
.dk.i{font-size:20px;font-weight:700;font-style:italic;line-height:1}
.dk.i:not([hidden]){animation:popin .55s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.chat{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;width:clamp(260px,25vw,400px);max-height:calc(100vh - 120px);overflow:auto;
  display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:4px}
.msg{max-width:100%;width:fit-content;background:var(--bubble);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 6px 18px;
  padding:11px 15px 12px;font-size:15px;line-height:1.42;box-shadow:0 12px 30px rgba(0,0,0,.12);animation:rise .3s cubic-bezier(.2,.8,.2,1);transform-origin:100% 100%}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
.msg a{text-underline-offset:.15em}
.msg a:hover{color:var(--accent)}
.dots{display:inline-flex;gap:4px;padding:3px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chips a,.chips button{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:var(--bg);animation:rise .3s both}
.chips a:hover,.chips button:hover{color:var(--accent);border-color:var(--accent)}
.chat>*{transition:opacity .28s,transform .32s cubic-bezier(.5,0,.75,0)}
.chat>.out{opacity:0;transform:translate(14px,24px) scale(.5)}
.dk.i.ping{animation:ping .9s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(140,140,148,.6)}100%{box-shadow:0 0 0 14px rgba(140,140,148,0)}}
.chat .x{font-size:12px;color:var(--muted);padding:2px 6px}
.chat .x:hover{color:var(--accent)}
@media (max-width:820px){.chat{width:calc(100vw - 40px)}.ticks{gap:6px;flex-wrap:nowrap}.ticks button{width:6px;height:6px}.hero .cap{bottom:84px;max-width:calc(100% - 32px)}}

/* ---------- tags ---------- */
.tags{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.tag{font-size:14px;line-height:1;padding:4px 8px 5px;border:1px solid var(--ink);border-radius:7px;background:var(--pill);white-space:nowrap;transition:opacity .2s,background .2s}
.tag.off{opacity:.2}

/* ---------- accordion ---------- */
.item{border-bottom:1px solid var(--line)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;width:100%;background:var(--paper);
  display:grid;grid-template-columns:var(--split) 1fr auto;gap:16px;align-items:start;padding:18px 28px 16px;transition:background .2s}
.head:hover{filter:brightness(.98)}
.item.open>.head{border-bottom:1px solid var(--line);background:var(--openhead)}
.meta{font-size:15px;line-height:1.25;white-space:pre-line;min-width:0}
.meta b{font-weight:500}
.head .tags{pointer-events:none;padding-top:2px}
.head .tag{font-size:13px;padding:3px 7px 4px}
.pm{width:28px;height:28px;position:relative;margin-top:2px}
.pm::before,.pm::after{content:"";position:absolute;left:6px;right:6px;top:13px;height:1.5px;background:var(--ink);transition:transform .3s}
.pm::after{transform:rotate(90deg)}
.item.open .pm::after{transform:rotate(0)}
.item.closing .pm::after{transform:rotate(90deg)}
.thumb{display:none}
/* card view: big hero photo on the left of each header */
.cards .head:not([aria-expanded="true"]){grid-template-columns:var(--split) 1fr auto;padding:16px 28px}
.cards .head:not([aria-expanded="true"]) .thumb{display:block;grid-row:1/3;aspect-ratio:16/10;width:calc(100% + 28px);max-width:none;margin:-16px 0 -16px -28px;overflow:hidden;border-radius:0;background:var(--media)}
.cards .head:not([aria-expanded="true"]) .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.cards .head:not([aria-expanded="true"]):hover .thumb img{transform:scale(1.03)}
.cards .head:not([aria-expanded="true"]) .meta{font-size:clamp(17px,1.5vw,22px)}
.cards .head:not([aria-expanded="true"]) .tags{grid-column:2;grid-row:2;align-self:end}
.cards .head:not([aria-expanded="true"]) .pm{grid-column:3;grid-row:1}

.body{display:grid;grid-template-columns:var(--split) 1fr;position:relative}
.endbar{grid-column:1/-1;display:grid;grid-template-columns:var(--split) 1fr;align-items:center;position:relative;z-index:6;background:#0b0b0c;color:#fff;overflow:hidden}
.endbar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-100%)}
.endbar.shine::after{animation:ebShine 1.2s cubic-bezier(.3,.6,.3,1)}
.endbar.shine .eb-ico{animation:ebPulse 1.1s ease-out .35s 2}
.eb-ico svg{animation:ebNudge 1.8s ease-in-out infinite}
@keyframes ebShine{to{transform:translateX(100%)}}
@keyframes ebPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 16px rgba(255,255,255,0)}}
@keyframes ebNudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.endbar.shine::after,.endbar.shine .eb-ico,.eb-ico svg{animation:none}}
.endbar>*{padding:22px 28px}
.eb-end{font-size:14px;color:rgba(255,255,255,.5)}
.eb-next{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;width:100%}
.eb-lbl{grid-column:2;font-size:13px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em}
.eb-name{grid-column:2;font-size:22px;font-weight:500;line-height:1.15}
.eb-ico{grid-column:1;grid-row:1/3;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);display:grid;place-items:center;transition:background .2s,color .2s,transform .2s}
.eb-next:hover .eb-ico{background:#fff;color:#0b0b0c;border-color:#fff}
.eb-next:hover .eb-name{text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
@media (max-width:820px){.endbar{grid-template-columns:1fr}.endbar>*{padding:18px 16px 22px}.eb-end{display:none}.eb-name{font-size:20px}}

.info{background:var(--column);min-width:0}
.info .in{position:sticky;top:var(--headh,96px);padding:28px 28px 32px;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - var(--headh,96px));overflow:auto}
.info p{margin:0;font-size:clamp(18px,1.5vw,26px);line-height:1.34;max-width:24em}
.facts{font-size:14px;color:var(--muted)}
.ext{display:inline-flex;gap:10px;align-items:center;font-size:clamp(16px,1.3vw,22px)}
.ext i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:13px}
.media{min-width:0;background:var(--media);display:grid}
.media figure{margin:0;position:relative}
.live{padding:56px clamp(48px,9%,140px) 64px;background:var(--media)}
.lv-bar{display:flex;align-items:center;gap:14px;height:38px;padding:0 14px;background:#f2f2f3;color:#141416;border-radius:10px 10px 0 0;font-size:13px}
.lv-dots{display:flex;gap:6px}.lv-dots i{width:10px;height:10px;border-radius:50%;background:#cfcfd4}
.lv-url{flex:1;text-align:center;color:#555}
.lv-open,.lv-x{color:#141416;text-decoration:none;white-space:nowrap}.lv-open:hover,.lv-x:hover{text-decoration:underline}
.lv-stage{position:relative;height:min(76vh,820px);background:#fff;border-radius:0 0 10px 10px;overflow:hidden}
.media .lv-stage img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.82)}
.lv-note{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#555;font-size:15px}
.lv-stage iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0}
.lv-go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border-radius:999px;background:#fff;color:#141416;font-size:16px;font-weight:500;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:transform .2s}
.lv-go:hover{transform:translate(-50%,-50%) scale(1.04)}
.snd{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 11px;border-radius:999px;background:rgba(11,11,12,.72);color:#fff;font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.snd:hover{background:#0b0b0c}.snd .on{display:none}.snd[aria-pressed="true"] .on{display:inline}.snd[aria-pressed="true"] .off{display:none}
.media figure.lgo figcaption{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:14px;line-height:1.4;padding:12px 16px 28px;background:var(--bg);color:var(--ink)}.media figure.lgo figcaption b{font-weight:400}
.media img,.media video{display:block;width:100%;height:auto}
.media video{max-height:calc(100vh - var(--headh,96px));object-fit:contain;background:#000}
.hero video.slide.fitv{object-fit:contain;background:#000}
.vwrap{position:relative;aspect-ratio:16/9;max-width:100%;background:#000}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:relative;display:block;color:#fff;text-decoration:none}
.vplay .pl{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);transition:transform .25s,background .25s}
.vplay .pl::after{content:"";position:absolute;left:34px;top:27px;border-left:22px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.vplay:hover .pl{transform:scale(1.08);background:rgba(255,255,255,.3)}
.vplay .vl{position:absolute;left:16px;bottom:14px;font-size:14px;background:rgba(0,0,0,.55);padding:6px 11px;border-radius:999px}
.video{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.video span{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;padding:10px 16px;border-radius:999px}
.video span::before{content:"";border-left:12px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.split{position:absolute;top:0;bottom:0;left:calc(var(--split) - 8px);width:16px;z-index:5;cursor:col-resize;touch-action:none}
.split::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;transition:background .2s}
.split:hover::before,.split.drag::before{background:var(--ink)}
.split span{position:sticky;top:50vh;display:block;margin-left:2px;width:12px;height:44px;border-radius:6px;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.split span::after{content:"";position:absolute;inset:14px 3px;border-left:1px solid var(--muted);border-right:1px solid var(--muted)}
body.dragging{cursor:col-resize;user-select:none}
.empty{padding:40px 28px;color:var(--muted)}
.totop{height:44px;min-width:44px;padding:0 13px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:0;color:var(--ink);
  background:color-mix(in srgb,var(--bubble) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:14px;transition:color .2s,gap .35s}
.totop svg{width:16px;height:16px;flex:none}
.totop .lbl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .4s cubic-bezier(.2,.8,.2,1),opacity .25s}
.totop.open{gap:7px}
.totop.open .lbl{max-width:130px;opacity:1}
.totop:hover{color:var(--accent)}
.totop:not([hidden]){animation:popin .45s cubic-bezier(.2,.9,.3,1.3)}
.foot{padding:40px 28px 60px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:15px}
.foot button{text-decoration:underline}

/* ---------- about ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;justify-content:space-between;gap:16px;padding:20px 28px 18px;border-bottom:1px solid var(--line)}
.bar .meta{font-size:15px}
.about{display:grid;grid-template-columns:var(--split) 1fr;min-height:100vh}
.side{background:var(--column);padding:30px 28px;min-width:0}
.side .stick{position:sticky;top:110px;display:flex;flex-direction:column;gap:22px}
.side p{margin:0;font-size:clamp(19px,1.6vw,27px);line-height:1.34}
.cv{padding:30px 28px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:36px;align-content:start;font-size:15px}
.cv h3{margin:0 0 4px;font-size:15px;font-weight:600}
.cv section{display:grid;gap:18px;align-content:start}
.cv p{margin:0}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .hero .top,.ix-top,.head,.foot,.bar{padding-left:16px;padding-right:16px}

}

  if(e.key==="Escape"){const c=document.getElementById("chat");if(c&&!c.hidden){closeChat();return}if(openId)toggle(openId)}
  if(!heroOn())return;
  if(e.key==="ArrowDown"||e.key==="PageDown"||e.key===" "){e.preventDefault();toIndex()}
  if(e.key==="ArrowRight")showSlide(si+1);
  if(e.key==="ArrowLeft")showSlide(si-1);
});

let drag=null;
addEventListener("pointerdown",e=>{const s=e.target.closest(".split");if(!s)return;e.preventDefault();drag={x:e.clientX,w:split,el:s};s.classList.add("drag");document.body.classList.add("dragging");s.setPointerCapture(e.pointerId)});
addEventListener("pointermove",e=>{if(!drag)return;split=drag.w+(e.clientX-drag.x);applySplit()});
addEventListener("pointerup",()=>{if(!drag)return;drag.el.classList.remove("drag");document.body.classList.remove("dragging");drag=null;store.set("split",split)});
addEventListener("keydown",e=>{const s=e.target.closest&&e.target.closest(".split");if(s&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){split+=e.key==="ArrowRight"?24:-24;applySplit();store.set("split",split);e.preventDefault()}});

/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1);
  if(h==="about"){aboutPage();scrollTo(0,0);return}
  if(!document.getElementById("hero"))page();
  if(h==="index"){foldHero();scrollTo(0,0)}
  else if(P.some(p=>p.id===h)){if(!match(P.find(p=>p.id===h))){filters.clear();renderIndex()}toggle(h,true,"jump")}
  else unfoldHero();
}
function go(h){
  const onAbout=location.hash.slice(1)==="about";
  if(h==="home"||h==="top"){
    if(onAbout){try{history.pushState(null,"",location.pathname+location.search)}catch(e){location.hash=""}route();return}
    if(heroEl()&&heroEl().hidden&&h==="top"){scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
    unfoldHero();return}
  if(h==="index"&&!onAbout&&heroEl()){if(heroOn())toIndex();else scrollTo({top:0,behavior:"smooth"});history.replaceState(null,"","#index");return}
  if(location.hash.slice(1)===h)route();else location.hash=h;
}
addEventListener("click",e=>{
  if(e.target.closest("#toTop")){
    // first press closes the open project, the next one goes to the top of the index
    if(openId){toggle(openId);return}
    scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
  if(e.target.closest("#infoBtn")){document.getElementById("chat").hidden?openChat():closeChat();return}
  if(e.target.closest("[data-closechat]")){closeChat();return}
  const cp=e.target.closest("[data-copy]");if(cp){const v=cp.dataset.copy;const done=()=>{cp.textContent="Copied ✓";setTimeout(()=>cp.textContent=v,1600)};
    try{navigator.clipboard.writeText(v).then(done,()=>{const r=document.createRange();r.selectNodeContents(cp);getSelection().removeAllRanges();getSelection().addRange(r)})}catch(_){}return}
  if(e.target.closest("#homeBtn")){closeChatNow();go("home");return}
  if(!document.getElementById("chat").hidden&&!e.target.closest("#chat")){closeChat()}
  const t=e.target.closest("[data-toggle]");if(t){toggle(t.dataset.toggle,false,false);return}
  const nx=e.target.closest("[data-next]");if(nx){toggle(nx.dataset.next,true,"jump");return}
  const et=e.target.closest("[data-endtop]");if(et){toggle(et.dataset.endtop,false,false);scrollTo(0,0);return}
  const o=e.target.closest("[data-open]");if(o){go(o.dataset.open);return}
  const st=e.target.closest("[data-step]");if(st){showSlide(si+(+st.dataset.step));return}
  const sb=e.target.closest("[data-snd]");if(sb){const v=sb.parentElement.querySelector("video"),on=v.muted;document.querySelectorAll(".media video").forEach(x=>{if(x!==v){x.muted=true;const b=x.parentElement.querySelector("[data-snd]");if(b)b.setAttribute("aria-pressed","false")}});v.muted=!on;if(on){v.play().catch(()=>{})}sb.setAttribute("aria-pressed",String(on));sb.setAttribute("aria-label",on?"Sound off":"Sound on");return}
  const lv=e.target.closest("[data-live]");if(lv){const p=P.find(x=>x.id===lv.dataset.live),f=document.getElementById("lv-"+p.id),st=f.querySelector(".lv-stage");
    st.innerHTML=!EMBEDS?`<div class="lv-note">The live website opens right here on ozansanal.com — this preview can’t load other sites.</div>`:`<iframe src="${p.live.url}" title="${p.name} website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>`;f.querySelector(".lv-x").hidden=false;fitLive(st);return}
  const lo=e.target.closest("[data-liveoff]");if(lo){const p=P.find(x=>x.id===lo.dataset.liveoff),f=document.getElementById("lv-"+p.id);f.outerHTML=liveHTML(p);return}
  const sd=e.target.closest("[data-slide]");if(sd){showSlide(+sd.dataset.slide);return}
  if(mobileMQ.matches&&e.target.closest("#hero")&&!e.target.closest("button,a,.top")){showSlide(si+1);return}   // phone: tap the photo for the next one
  if(e.target.closest("#slide")){go(SL[si].p.id);return}
  const f=e.target.closest("[data-filter]");if(f){const tag=f.dataset.filter;filters.has(tag)?filters.delete(tag):filters.add(tag);
    renderIndex(openId&&match(P.find(p=>p.id===openId))?openId:null);return}
  if(e.target.closest("[data-clear]")){filters.clear();renderIndex(openId);return}
  const m=e.target.closest("[data-mode]");if(m){mode=m.dataset.mode;store.set("view",mode);document.getElementById("list").className=mode==="cards"?"cards":"";syncCtrls();if(openId){const it=document.getElementById("i-"+openId);it.style.setProperty("--headh",it.querySelector(".head").offsetHeight+"px")}return}
  const d=e.target.closest("#themeBtn");if(d){dark=!dark;store.set("dark",dark?"1":"0");document.documentElement.classList.toggle("dark",dark);syncCtrls();return}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
});
